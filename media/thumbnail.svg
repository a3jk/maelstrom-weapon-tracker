<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset="1" stop-color="#070a14"/>
    </radialGradient>
    <radialGradient id="vortex" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e9fbff"/>
      <stop offset="0.35" stop-color="#5cc8ff"/>
      <stop offset="1" stop-color="#123a6e"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="icon">
      <rect x="100" y="90" width="200" height="200" rx="14"/>
    </clipPath>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- outer glow ring (like the in-game 5-stack glow) -->
  <rect x="100" y="90" width="200" height="200" rx="14" fill="none"
        stroke="#ccffff" stroke-width="26" filter="url(#blur)" opacity="0.9"/>
  <rect x="100" y="90" width="200" height="200" rx="14" fill="none"
        stroke="#ccffff" stroke-width="6"/>

  <!-- icon: swirling maelstrom -->
  <g clip-path="url(#icon)">
    <rect x="100" y="90" width="200" height="200" fill="url(#vortex)"/>
    <g fill="none" stroke="#ffffff" stroke-linecap="round" opacity="0.85">
      <path d="M200 190 m0 -12 a12 12 0 1 1 -12 12 a28 28 0 0 1 28 -28 a46 46 0 0 1 46 46 a66 66 0 0 1 -66 66 a88 88 0 0 1 -88 -88" stroke-width="7"/>
      <path d="M200 190 m0 12 a12 12 0 1 1 12 -12 a28 28 0 0 1 -28 28 a46 46 0 0 1 -46 -46 a66 66 0 0 1 66 -66 a88 88 0 0 1 88 88" stroke-width="5" opacity="0.6"/>
    </g>
    <!-- lightning bolt -->
    <path d="M214 112 L170 196 L198 196 L182 268 L236 170 L206 170 Z"
          fill="#fff6c8" filter="url(#soft)"/>
    <path d="M214 112 L170 196 L198 196 L182 268 L236 170 L206 170 Z"
          fill="#ffffff" stroke="#3a6ea8" stroke-width="2"/>
  </g>

  <!-- stack count -->
  <text x="288" y="282" text-anchor="end" font-family="Segoe UI, Arial, sans-serif"
        font-weight="900" font-size="78" fill="#66e5ff" stroke="#05121f" stroke-width="6"
        paint-order="stroke">5</text>

  <!-- title -->
  <text x="200" y="356" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
        font-weight="800" font-size="34" fill="#e9fbff" letter-spacing="1">Maelstrom Tracker</text>
</svg>
